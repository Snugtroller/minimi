<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Searchlight</title>
    <link rel="stylesheet" href="/public/styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand"><span class="mark">✦</span><span>Searchlight</span></div>
        <span class="status"><i></i> Web-grounded chat</span>
      </header>
      <section class="hero" id="hero">
        <p class="eyebrow">One tool. Better answers.</p>
        <h1>Ask anything.<br><em>See what’s current.</em></h1>
        <p class="intro">A focused chat agent that searches the web when it matters, then gives you a clear answer with sources.</p>
      </section>
      <section class="chat" id="chat" aria-live="polite"></section>
      <form class="composer" id="composer">
        <textarea id="input" rows="1" placeholder="Ask a question..." aria-label="Message"></textarea>
        <button type="submit" aria-label="Send message"><span>↗</span></button>
      </form>
      <div class="chips">
        <button type="button">What changed in AI this week?</button>
        <button type="button">Explain a complex idea simply</button>
        <button type="button">Find the best sources for...</button>
      </div>
      <p class="fineprint">Searchlight can make mistakes. Check the linked sources for important decisions.</p>
    </main>
    <script src="/public/app.js"></script>
  </body>
</html>
